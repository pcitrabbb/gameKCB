<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game One Line</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hiasan latar: lingkaran dan titik-titik di sudut layar -->
    <div class="deko deko-lingkaran-a"></div>
    <div class="deko deko-cincin-a"></div>
    <div class="deko deko-lingkaran-b"></div>
    <div class="deko deko-cincin-b"></div>
    <div class="deko deko-titik deko-titik-a"></div>
    <div class="deko deko-titik deko-titik-b"></div>

    <header class="judul-game">
        <div class="hiasan-judul"><span></span><i></i><span></span></div>
        <h1>One <em>Line</em></h1>
        <p class="subjudul">Connect all the dots in one line!</p>
    </header>

    <!-- ===== Halaman 1: pilih mode ===== -->
    <section id="menu">

        <button class="kartu-mode mode-easy" data-mode="easy">
            <span class="ikon-mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
            </span>
            <span class="label-mode">Easy</span>
            <svg class="panah" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>

        <button class="kartu-mode mode-medium" data-mode="medium">
            <span class="ikon-mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
            </span>
            <span class="label-mode">Medium</span>
            <svg class="panah" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>

        <button class="kartu-mode mode-hard" data-mode="hard">
            <span class="ikon-mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="m12 2 3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>
            </span>
            <span class="label-mode">Hard</span>
            <svg class="panah" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
    </section>

    <!-- ===== Halaman 2: pilih level (level yang belum dilewati masih terkunci) ===== -->
    <section id="pilih-level" hidden>
        <h2 id="judul-mode">Easy</h2>
        <div id="grid-level"></div>
        <div class="tombol">
            <button id="btn-kembali" class="sekunder">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                Kembali
            </button>
        </div>
    </section>

    <!-- ===== Halaman 3: permainan ===== -->
    <section id="area-game" hidden>
        <h2 id="level-title">Level 1</h2>
        <p id="status">Seret dari lingkaran terang.</p>

        <canvas id="game"></canvas>

        <div class="tombol">
            <button id="btn-reset">Reset</button>
            <button id="btn-hint">Hint (3)</button>
            <button id="btn-menu" class="sekunder">Pilih Level</button>
        </div>
    </section>

    <!-- Popup menang: muncul di tengah layar setiap level selesai -->
    <div id="overlay" hidden>
        <canvas id="konfeti"></canvas>
        <div class="kotak-akhir">
            <div class="emoji-besar">🎉</div>
            <h2 id="overlay-judul">Kamu Menang!</h2>
            <p id="overlay-teks">Level selesai.</p>
            <div class="tombol">
                <button id="btn-next" class="besar">Next ➜</button>
                <button id="btn-pilih-level" hidden>Pilih Level</button>
                <button id="btn-menu-akhir" hidden>Pilih Mode</button>
                <button id="btn-close" class="sekunder" hidden>Tutup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
